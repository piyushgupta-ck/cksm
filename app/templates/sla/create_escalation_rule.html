{% extends "base.html" %}
{% block title %}Create Escalation Rule{% endblock %}

{% block content %}
<div class="mb-6 flex items-center justify-between">
    <h1 class="text-2xl font-bold text-gray-900">Create Escalation Rule</h1>
    <a href="{{ url_for('sla.index') }}" class="text-sm text-primary-600 hover:text-primary-800">&larr; Back to SLA</a>
</div>

<div class="bg-white shadow rounded-lg p-6 max-w-xl">
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">Rule Name <span class="text-red-500">*</span></label>
            <input type="text" name="name" required
                   class="block w-full rounded-md border-gray-300 ring-1 ring-gray-300 px-3 py-1.5 text-sm focus:ring-2 focus:ring-primary-500"
                   placeholder="e.g. Critical L1 Resolution Warning">
        </div>

        <div class="grid grid-cols-2 gap-4 mb-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Department</label>
                <select name="department_id"
                        class="block w-full rounded-md border-gray-300 ring-1 ring-gray-300 px-3 py-1.5 text-sm focus:ring-2 focus:ring-primary-500">
                    <option value="">All Departments</option>
                    {% for d in departments %}
                    <option value="{{ d.id }}">{{ d.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Priority</label>
                <select name="priority"
                        class="block w-full rounded-md border-gray-300 ring-1 ring-gray-300 px-3 py-1.5 text-sm focus:ring-2 focus:ring-primary-500">
                    <option value="">All Priorities</option>
                    {% for p in priorities %}
                    <option value="{{ p }}">{{ p }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class="grid grid-cols-2 gap-4 mb-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Escalation Level</label>
                <select name="level"
                        class="block w-full rounded-md border-gray-300 ring-1 ring-gray-300 px-3 py-1.5 text-sm focus:ring-2 focus:ring-primary-500">
                    <option value="1">L1 – Warning</option>
                    <option value="2">L2 – Urgent</option>
                    <option value="3">L3 – Critical</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">SLA Type</label>
                <select name="sla_type"
                        class="block w-full rounded-md border-gray-300 ring-1 ring-gray-300 px-3 py-1.5 text-sm focus:ring-2 focus:ring-primary-500">
                    <option value="resolution">Resolution SLA</option>
                    <option value="first_response">First Response SLA</option>
                </select>
            </div>
        </div>

        <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">
                Trigger Threshold (% of SLA elapsed)
            </label>
            <div class="flex items-center space-x-2">
                <input type="number" name="breach_threshold_percent" min="1" max="200"
                       value="80"
                       class="w-24 rounded-md border-gray-300 ring-1 ring-gray-300 px-3 py-1.5 text-sm focus:ring-2 focus:ring-primary-500">
                <span class="text-sm text-gray-500">% (e.g. 80 = trigger when 80% of SLA time has elapsed)</span>
            </div>
        </div>

        <div class="mb-6">
            <label class="block text-sm font-medium text-gray-700 mb-1">Notify User</label>
            <select name="notify_user_id"
                    class="block w-full rounded-md border-gray-300 ring-1 ring-gray-300 px-3 py-1.5 text-sm focus:ring-2 focus:ring-primary-500">
                <option value="">No notification</option>
                {% for a in agents %}
                <option value="{{ a.id }}">{{ a.full_name }} ({{ a.role.name }})</option>
                {% endfor %}
            </select>
        </div>

        <div class="flex space-x-3">
            <button type="submit"
                    class="rounded-md bg-primary-600 px-4 py-2 text-sm font-semibold text-white hover:bg-primary-500">
                Create Rule
            </button>
            <a href="{{ url_for('sla.index') }}"
               class="rounded-md bg-white px-4 py-2 text-sm font-semibold text-gray-700 shadow-sm ring-1 ring-gray-300 hover:bg-gray-50">
                Cancel
            </a>
        </div>
    </form>
</div>
{% endblock %}
