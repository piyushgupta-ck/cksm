{% extends "base.html" %}
{% block title %}Edit SLA Policy{% endblock %}

{% block content %}
<div class="mb-6 flex items-center justify-between">
    <h1 class="text-2xl font-bold text-gray-900">Edit SLA Policy</h1>
    <a href="{{ url_for('sla.index') }}" class="text-sm text-primary-600 hover:text-primary-800">&larr; Back to SLA</a>
</div>

<div class="bg-white shadow rounded-lg p-6 max-w-xl">
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">Policy Name <span class="text-red-500">*</span></label>
            <input type="text" name="name" required value="{{ policy.name }}"
                   class="block w-full rounded-md border-gray-300 ring-1 ring-gray-300 px-3 py-1.5 text-sm focus:ring-2 focus:ring-primary-500">
        </div>

        <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">Department</label>
            <select name="department_id"
                    class="block w-full rounded-md border-gray-300 ring-1 ring-gray-300 px-3 py-1.5 text-sm focus:ring-2 focus:ring-primary-500">
                <option value="">All Departments</option>
                {% for d in departments %}
                <option value="{{ d.id }}" {% if policy.department_id == d.id %}selected{% endif %}>{{ d.name }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">Priority</label>
            <select name="priority"
                    class="block w-full rounded-md border-gray-300 ring-1 ring-gray-300 px-3 py-1.5 text-sm focus:ring-2 focus:ring-primary-500">
                <option value="">All Priorities</option>
                {% for p in priorities %}
                <option value="{{ p }}" {% if policy.priority == p %}selected{% endif %}>{{ p }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="grid grid-cols-2 gap-4 mb-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">First Response (hours)</label>
                <input type="number" name="first_response_hours" step="0.5" min="0.5" required
                       value="{{ policy.first_response_hours }}"
                       class="block w-full rounded-md border-gray-300 ring-1 ring-gray-300 px-3 py-1.5 text-sm focus:ring-2 focus:ring-primary-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Resolution (hours)</label>
                <input type="number" name="resolution_hours" step="0.5" min="1" required
                       value="{{ policy.resolution_hours }}"
                       class="block w-full rounded-md border-gray-300 ring-1 ring-gray-300 px-3 py-1.5 text-sm focus:ring-2 focus:ring-primary-500">
            </div>
        </div>

        <div class="mb-4">
            <label class="flex items-center space-x-2">
                <input type="checkbox" name="use_business_hours"
                       {% if policy.use_business_hours %}checked{% endif %}
                       class="rounded border-gray-300 text-primary-600">
                <span class="text-sm text-gray-700">Apply business hours</span>
            </label>
        </div>

        <div class="mb-6">
            <label class="flex items-center space-x-2">
                <input type="checkbox" name="is_active"
                       {% if policy.is_active %}checked{% endif %}
                       class="rounded border-gray-300 text-primary-600">
                <span class="text-sm text-gray-700">Active</span>
            </label>
        </div>

        <div class="flex space-x-3">
            <button type="submit"
                    class="rounded-md bg-primary-600 px-4 py-2 text-sm font-semibold text-white hover:bg-primary-500">
                Save Changes
            </button>
            <a href="{{ url_for('sla.index') }}"
               class="rounded-md bg-white px-4 py-2 text-sm font-semibold text-gray-700 shadow-sm ring-1 ring-gray-300 hover:bg-gray-50">
                Cancel
            </a>
        </div>
    </form>
</div>
{% endblock %}
